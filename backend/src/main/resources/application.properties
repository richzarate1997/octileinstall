# Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/octileinstall?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=your-super-secret-jwt-key-change-this-in-production-with-minimum-256-bits
app.jwt.expiration=604800000

# Logging
logging.level.root=INFO
logging.level.com.octileinstall=DEBUG

# Application Configuration
app.name=OctileInstall Admin Backend
app.version=1.0.0
