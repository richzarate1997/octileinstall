# Server Configuration
# NOTE: no context-path here on purpose. Spring Security's requestMatchers match
# the path *within* the servlet context, so a context-path of /api would mean the
# matchers had to be written "/auth/login" while the client calls "/api/auth/login".
# That mismatch silently permits or blocks the wrong routes. The /api prefix lives
# in the controllers' @RequestMapping instead, so matchers are literal URLs.
server.port=${SERVER_PORT:8081}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/octileinstall?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Dialect is intentionally unset - Hibernate 6 auto-detects it from the connection.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate is the single owner of DDL. backend/db/schema.sql is reference documentation
# and must never be auto-executed - Spring Boot would otherwise run a classpath schema.sql
# against embedded (H2) datasources, which is how the test context broke once already.
spring.sql.init.mode=never

# JWT Configuration
# Secret MUST be >= 32 bytes (256 bits) for HS256. The app refuses to start otherwise.
# Override in production: set the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
app.jwt.expiration=604800000

# CORS - every origin allowed to call this API from a browser. Two different callers use
# this list: the Vite admin dashboard (port 5177, not Vite's default 5173 - other local dev
# servers already held 5173-5176 on this machine; see admin-dashboard/vite.config.js) and the
# public marketing site's quote form, which POSTs to /api/public/inquiry directly from
# index.html. Add every real origin the browser will call this API from - there is no
# wildcard fallback (see SecurityConfig), so a missing origin here means CORS silently blocks
# it in the browser console rather than the API rejecting it server-side.
app.cors.allowed-origins=http://localhost:5177,http://127.0.0.1:5177,https://www.octileinstall.com,https://octileinstall.com

# Rate limiting for POST /api/public/inquiry (RateLimiterService) - the only unauthenticated
# write endpoint, reachable by anyone. Per-IP, in-memory, single-instance only (see the class
# javadoc). 5 submissions per 15 minutes comfortably covers a real visitor filling the form
# more than once (a typo, a change of mind) without leaving the endpoint open to hammering.
app.public-inquiry.rate-limit.max-requests=5
app.public-inquiry.rate-limit.window-minutes=15

# Initial admin seeding (see DataSeeder). Only creates the user if it does not exist;
# it never overwrites an existing password.
app.admin.seed-enabled=true
app.admin.seed-email=alberto@octileinstall.com
app.admin.seed-full-name=Alberto
app.admin.seed-password=${ADMIN_SEED_PASSWORD:}

# Logging
logging.level.root=INFO
logging.level.com.octileinstall=DEBUG

# Application Configuration
app.name=OctileInstall Admin Backend
app.version=1.0.0
