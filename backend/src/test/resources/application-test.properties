# In-memory H2 so the auth tests run without a MySQL instance.
spring.datasource.url=jdbc:h2:mem:octileinstall;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixed, >=32 byte secret so token assertions are deterministic.
app.jwt.secret=test-secret-key-for-integration-tests-0123456789
app.jwt.expiration=604800000

app.cors.allowed-origins=http://localhost:5177

# Small so PublicInquiryControllerIntegrationTest can exercise the "exceeded" path in a
# handful of requests instead of hundreds. Each test in that class uses a distinct fake
# remote address so they can't interfere with each other's counters.
app.public-inquiry.rate-limit.max-requests=3
app.public-inquiry.rate-limit.window-minutes=15

# Tests create their own users; the seeder would just add noise.
app.admin.seed-enabled=false
app.admin.seed-email=unused@example.com
app.admin.seed-full-name=Unused

logging.level.root=WARN
